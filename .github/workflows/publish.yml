name: Publish to NPM

# Publishing happens ONLY on a GitHub Release. Creating a release also
# creates its tag, so a separate `v*` tag trigger would fire a second
# (failing) publish run. Pushes/PRs are gated by ci.yml instead.

on:
  release:
    types: [ published ]

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies (runs `prepare` → build)
        run: npm ci

      - name: Smoke test
        run: npm test

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
